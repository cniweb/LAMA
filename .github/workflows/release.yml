name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create GitHub Release from tag
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          # Nimmt Tag-Namen als Release-Titel, Body wird aus Commits generiert.
          # Für detaillierte Notes siehe CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
